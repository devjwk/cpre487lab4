<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" role="img" aria-label="Lab 4 at a glance: size, speed, accuracy and where quantization breaks">
<title>Lab 4 at a glance: size, speed, accuracy and where quantization breaks</title>
<style>.q{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}.big{font:800 44px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.sub{font:500 14px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.lab{font:500 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.val{font:700 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.valbig{font:700 16px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.note{font:500 12px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.tiny{font:600 11px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}</style>
<rect width="1200" height="384" fill="#ffffff"/>
<g transform="translate(0,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#7E22CE"/>
<text x="18" y="38" class="q" fill="#7E22CE">HOW MUCH SMALLER?</text>
<text x="18" y="92" class="big" fill="#0B1220">4×</text>
<text x="18" y="118" class="sub">8-bit parameters on disk,</text>
<text x="18" y="136" class="sub">compared with 32-bit floats.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">fp32</text>
<rect x="52" y="4" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="4" width="139.6" height="22" fill="#7E22CE"/>
<text x="205" y="20" class="val">3,081</text>
<text x="0" y="57" class="lab">8-bit</text>
<rect x="52" y="42" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="42" width="35.0" height="22" fill="#F0ABFC"/>
<text x="205" y="58" class="val">773</text>
<text x="0" y="95" class="lab">4-bit</text>
<rect x="52" y="80" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="80" width="17.6" height="22" fill="#7E22CE"/>
<text x="205" y="96" class="val">388</text>
<text x="0" y="133" class="lab">2-bit</text>
<rect x="52" y="118" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="118" width="8.9" height="22" fill="#7E22CE"/>
<text x="205" y="134" class="val">196</text><text x="0" y="170" class="note">KB. 4- and 2-bit sizes are if packed.</text></g></g>
<g transform="translate(305,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#7E22CE"/>
<text x="18" y="38" class="q" fill="#7E22CE">HOW MUCH FASTER?</text>
<text x="18" y="92" class="big" fill="#0B1220">1.6×</text>
<text x="18" y="118" class="sub">8-bit latency per image on the</text>
<text x="18" y="136" class="sub">lab PC, compared with fp32.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">fp32</text>
<rect x="52" y="4" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="4" width="129.5" height="22" fill="#7E22CE"/>
<text x="205" y="20" class="val">143 ms</text>
<text x="0" y="57" class="lab">8-bit</text>
<rect x="52" y="42" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="42" width="79.4" height="22" fill="#F0ABFC"/>
<text x="205" y="58" class="val">88 ms</text>
<text x="0" y="95" class="lab">4-bit</text>
<rect x="52" y="80" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="80" width="79.4" height="22" fill="#7E22CE"/>
<text x="205" y="96" class="val">88 ms</text>
<text x="0" y="133" class="lab">2-bit</text>
<rect x="52" y="118" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="118" width="79.6" height="22" fill="#7E22CE"/>
<text x="205" y="134" class="val">88 ms</text><text x="0" y="170" class="note">4- and 2-bit use int8 containers.</text></g></g>
<g transform="translate(610,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#7E22CE"/>
<text x="18" y="38" class="q" fill="#7E22CE">DOES ACCURACY SURVIVE?</text>
<text x="18" y="92" class="big" fill="#0B1220">23.8%</text>
<text x="18" y="118" class="sub">Top-1 at 8 bits, the same as</text>
<text x="18" y="136" class="sub">fp32 (23.5%) within noise.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">fp32</text>
<rect x="52" y="4" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="4" width="113.6" height="22" fill="#7E22CE"/>
<text x="205" y="20" class="val">23.5%</text>
<text x="0" y="57" class="lab">8-bit</text>
<rect x="52" y="42" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="42" width="115.0" height="22" fill="#F0ABFC"/>
<text x="205" y="58" class="val">23.8%</text>
<text x="0" y="95" class="lab">4-bit</text>
<rect x="52" y="80" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="80" width="31.9" height="22" fill="#7E22CE"/>
<text x="205" y="96" class="val">6.6%</text>
<text x="0" y="133" class="lab">2-bit</text>
<rect x="52" y="118" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="118" width="1.4" height="22" fill="#7E22CE"/>
<text x="205" y="134" class="val">0.3%</text><text x="0" y="170" class="note">Top-1 on 1,000 validation images.</text></g></g>
<g transform="translate(915,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#7E22CE"/>
<text x="18" y="38" class="q" fill="#7E22CE">WHERE DOES IT BREAK?</text>
<text x="18" y="92" class="big" fill="#0B1220">4 bits</text>
<text x="18" y="118" class="sub">Most of the accuracy is gone;</text>
<text x="18" y="136" class="sub">2 bits is at chance level.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">fp32</text>
<rect x="52" y="4" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="4" width="125.3" height="22" fill="#7E22CE"/>
<text x="205" y="20" class="val">60.5%</text>
<text x="0" y="57" class="lab">8-bit</text>
<rect x="52" y="42" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="42" width="125.1" height="22" fill="#7E22CE"/>
<text x="205" y="58" class="val">60.4%</text>
<text x="0" y="95" class="lab">4-bit</text>
<rect x="52" y="80" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="80" width="49.9" height="22" fill="#F0ABFC"/>
<text x="205" y="96" class="val">24.1%</text>
<text x="0" y="133" class="lab">2-bit</text>
<rect x="52" y="118" width="145" height="22" fill="#E2E8F0"/>
<rect x="52" y="118" width="9.5" height="22" fill="#7E22CE"/>
<text x="205" y="134" class="val">4.6%</text><text x="0" y="170" class="note">Top-10 on the same images.</text></g></g>
</svg>
